apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-api-config
  namespace: oficina
data:
  PORT: "3000"
  NODE_ENV: "production"
  SEED_DATA: "false"
  LOG_LEVEL: "info"
  # RUN_MIGRATIONS_ON_BOOT=false: migrations rodam via Job dedicado
  # (02-migrate-job.tpl.yaml), nao a cada Pod do Deployment subindo.
  RUN_MIGRATIONS_ON_BOOT: "false"
  # Endpoint do RDS PostgreSQL (Repositorio 1 - oficina-db-infrastructure),
  # nao mais um Postgres in-cluster como na Fase 2.
  DB_HOST: "${db_host}"
  DB_PORT: "${db_port}"
  DB_NAME: "${db_name}"
