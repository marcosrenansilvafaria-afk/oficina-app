services:
  os-postgres:
    image: postgres:16-alpine
    container_name: saga_e2e_os_postgres
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina123
      POSTGRES_DB: oficina_os_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_os_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  execution-postgres:
    image: postgres:16-alpine
    container_name: saga_e2e_execution_postgres
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina123
      POSTGRES_DB: oficina_execution_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_execution_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: saga_e2e_billing_dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  billing-create-tables:
    image: amazon/aws-cli:2.17.0
    container_name: saga_e2e_billing_create_tables
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 > /dev/null 2>&1; do sleep 1; done
        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 \
          --table-name billing-orcamentos --attribute-definitions AttributeName=id,AttributeType=S AttributeName=ordemServicoId,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST \
          --global-secondary-indexes "[{\"IndexName\":\"ordemServicoId-index\",\"KeySchema\":[{\"AttributeName\":\"ordemServicoId\",\"KeyType\":\"HASH\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]" || true
        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 \
          --table-name billing-pagamentos --attribute-definitions AttributeName=id,AttributeType=S AttributeName=ordemServicoId,AttributeType=S AttributeName=mercadoPagoPaymentId,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST \
          --global-secondary-indexes "[{\"IndexName\":\"ordemServicoId-index\",\"KeySchema\":[{\"AttributeName\":\"ordemServicoId\",\"KeyType\":\"HASH\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}},{\"IndexName\":\"mercadoPagoPaymentId-index\",\"KeySchema\":[{\"AttributeName\":\"mercadoPagoPaymentId\",\"KeyType\":\"HASH\"}],\"Projection\":{\"ProjectionType\":\"ALL\"}}]" || true
        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 \
          --table-name billing-webhook-logs --attribute-definitions AttributeName=id,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST || true
        echo "Tabelas prontas."

  os-service:
    build:
      context: ../oficina-os-service
      dockerfile: Dockerfile
    container_name: saga_e2e_os_service
    ports:
      - "3001:3000"
    depends_on:
      os-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oficina:oficina123@os-postgres:5432/oficina_os_db
      JWT_SECRET: dev-secret-saga-e2e
      PORT: "3000"
      SEED_DATA: "false"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      SAGA_TOPIC_ARN: ${SAGA_TOPIC_ARN:-arn:aws:sns:us-east-1:699372251061:oficina-saga-events.fifo}
      SAGA_QUEUE_URL: ${SAGA_OS_QUEUE_URL:-https://sqs.us-east-1.amazonaws.com/699372251061/oficina-saga-os-service.fifo}

  billing-service:
    build:
      context: ../oficina-billing-service
      dockerfile: Dockerfile
    container_name: saga_e2e_billing_service
    ports:
      - "3002:3000"
    depends_on:
      - billing-create-tables
    environment:
      PORT: "3000"
      JWT_SECRET: dev-secret-saga-e2e
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_ORCAMENTOS: billing-orcamentos
      DYNAMODB_TABLE_PAGAMENTOS: billing-pagamentos
      DYNAMODB_TABLE_WEBHOOK_LOGS: billing-webhook-logs
      # Sem MERCADOPAGO_ACCESS_TOKEN: usa o FakeMercadoPagoGateway de proposito
      # (ver infraestructure/mercadopago/) - a simulacao E2E nao tem
      # credenciais de sandbox reais do Mercado Pago (pendencia documentada).
      MERCADOPAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_WEBHOOK_SECRET: ""
      # Habilita o seam de teste POST /test/mercadopago/proximo-status,
      # usado pelo cenario de compensacao por pagamento recusado.
      ENABLE_SAGA_E2E_TEST_ENDPOINTS: "true"
      SAGA_TOPIC_ARN: ${SAGA_TOPIC_ARN:-arn:aws:sns:us-east-1:699372251061:oficina-saga-events.fifo}
      SAGA_QUEUE_URL: ${SAGA_BILLING_QUEUE_URL:-https://sqs.us-east-1.amazonaws.com/699372251061/oficina-saga-billing-service.fifo}

  execution-service:
    build:
      context: ../oficina-execution-service
      dockerfile: Dockerfile
    container_name: saga_e2e_execution_service
    ports:
      - "3003:3000"
    depends_on:
      execution-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://oficina:oficina123@execution-postgres:5432/oficina_execution_db
      JWT_SECRET: dev-secret-saga-e2e
      PORT: "3000"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      SAGA_TOPIC_ARN: ${SAGA_TOPIC_ARN:-arn:aws:sns:us-east-1:699372251061:oficina-saga-events.fifo}
      SAGA_QUEUE_URL: ${SAGA_EXECUTION_QUEUE_URL:-https://sqs.us-east-1.amazonaws.com/699372251061/oficina-saga-execution-service.fifo}
